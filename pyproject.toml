[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frequency-tails-replication"
version = "0.1.0"
description = "Reproducible analysis pipeline for uncertainty and bank equity research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.7", "openpyxl>=3.1", "yfinance>=0.2.40", "arch>=7.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
frequency-tails = "frequency_tails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
